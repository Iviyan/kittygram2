services:
  web:
    build: .
    env_file: .env
    volumes:
      - static:/app/static
      - ./db.sqlite3:/app/db.sqlite3
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static:/app/static
    depends_on:
      - web

volumes:
  static:
